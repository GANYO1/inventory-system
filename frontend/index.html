<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <style>
        /* Reset default browser styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Base page styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
        }

        /* Top navigation bar */
        .navbar {
            background-color: #1a1a2e;
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 20px;
            font-weight: 600;
        }

        /* Shows logged in username */
        .navbar span {
            font-size: 14px;
            color: #a0aec0;
        }

        /* Main content area with padding */
        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
        }

        /* Login card centered on screen */
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            margin: 80px auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .login-card h2 {
            margin-bottom: 24px;
            font-size: 24px;
            color: #1a1a2e;
        }

        /* Stats row at top of dashboard */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        /* Individual stat card */
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .stat-card .label {
            font-size: 13px;
            color: #718096;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .stat-card .value.warning {
            /* Red color for low stock count */
            color: #e53e3e;
        }

        /* Section containing the products table */
        .section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #1a1a2e;
        }

        /* Full width table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* Table header row */
        thead th {
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #718096;
            border-bottom: 2px solid #e2e8f0;
        }

        /* Table data rows */
        tbody td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid #f7fafc;
        }

        /* Highlight row on hover */
        tbody tr:hover {
            background-color: #f7fafc;
        }

        /* Stock level badge */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.ok {
            background-color: #c6f6d5;
            color: #276749;
        }

        .badge.low {
            background-color: #fed7d7;
            color: #9b2c2c;
        }

        .badge.out {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        /* Form inputs */
        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #1a1a2e;
        }

        /* Buttons */
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .btn-primary {
            background-color: #1a1a2e;
            color: white;
            width: 100%;
        }

        .btn-success {
            background-color: #38a169;
            color: white;
        }

        /* Error and success messages */
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .message.error {
            background-color: #fed7d7;
            color: #9b2c2c;
        }

        .message.success {
            background-color: #c6f6d5;
            color: #276749;
        }

        /* Add product form row */
        .form-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr) auto;
            gap: 12px;
            align-items: end;
        }

        .form-row input {
            margin-bottom: 0;
        }

        /* Hide elements */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Navigation bar — hidden until logged in -->
    <nav class="navbar hidden" id="navbar">
        <h1>Inventory Management System</h1>
        <span id="logged-in-user"></span>
    </nav>

    <!-- Login screen — shown first -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Sign In</h2>

            <!-- Error message shown on failed login -->
            <div class="message error hidden" id="login-error"></div>

            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="btn-primary" onclick="login()">Sign In</button>
        </div>
    </div>

    <!-- Dashboard — hidden until logged in -->
    <div id="dashboard" class="hidden">
        <div class="container">

            <!-- Stats row -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="label">Total Products</div>
                    <div class="value" id="total-products">--</div>
                </div>
                <div class="stat-card">
                    <div class="label">Total Inventory Value</div>
                    <div class="value" id="total-value">--</div>
                </div>
                <div class="stat-card">
                    <div class="label">Low Stock Items</div>
                    <div class="value warning" id="low-stock-count">--</div>
                </div>
            </div>

            <!-- Add product form -->
            <div class="section">
                <h2>Add New Product</h2>

                <!-- Success or error message after adding -->
                <div class="message hidden" id="add-message"></div>

                <div class="form-row">
                    <input type="number" id="new-id" placeholder="Product ID">
                    <input type="text" id="new-name" placeholder="Product Name">
                    <input type="number" id="new-price" placeholder="Price (GHS)" step="0.01">
                    <input type="number" id="new-quantity" placeholder="Quantity">
                    <button class="btn-success" onclick="addProduct()">Add Product</button>
                </div>
            </div>

            <!-- Products table -->
            <div class="section">
                <h2>All Products</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Price (GHS)</th>
                            <th>Quantity</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <!-- Rows are inserted here by JavaScript -->
                    <tbody id="products-table-body">
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        // Base URL of your FastAPI backend
        // Change this to your deployed URL when you go live
        const API_URL = "http://127.0.0.1:8000";

        // Stores the JWT token after login
        // Used in the Authorization header for all protected requests
        let token = null;

        // Called when the Sign In button is clicked
        async function login() {
            // Get values from the input fields
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                // Send POST request to /auth/login
                // OAuth2 requires form data not JSON — using URLSearchParams
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: "POST",
                    headers: {"Content-Type": "application/x-www-form-urlencoded"},
                    body: new URLSearchParams({username, password})
                });

                if (!response.ok) {
                    // Login failed — show error message
                    showMessage("login-error", "Invalid username or password", "error");
                    return;
                }

                // Login successful — extract the token from the response
                const data = await response.json();
                token = data.access_token;

                // Show the username in the navbar
                document.getElementById("logged-in-user").textContent = `Logged in as ${username}`;

                // Hide login screen, show dashboard and navbar
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("navbar").classList.remove("hidden");
                document.getElementById("dashboard").classList.remove("hidden");

                // Load the product data from the API
                loadDashboard();

            } catch (error) {
                showMessage("login-error", "Could not connect to server", "error");
            }
        }

        // Loads all dashboard data after login
        async function loadDashboard() {
            await loadProducts();
            await loadStats();
        }

        // Fetches all products and renders them in the table
        async function loadProducts() {
            const response = await fetch(`${API_URL}/products`, {
                // Send the JWT token in the Authorization header
                // "Bearer" is the standard prefix for JWT tokens
                headers: {"Authorization": `Bearer ${token}`}
            });

            const products = await response.json();

            // Get the table body element where rows will be inserted
            const tbody = document.getElementById("products-table-body");

            // Clear existing rows before adding new ones
            tbody.innerHTML = "";

            // Create one table row per product
            products.forEach(product => {
                // Determine stock status badge based on quantity
                let badge;
                if (product.quantity === 0) {
                    badge = `<span class="badge out">Out of Stock</span>`;
                } else if (product.quantity < 5) {
                    badge = `<span class="badge low">Low Stock</span>`;
                } else {
                    badge = `<span class="badge ok">In Stock</span>`;
                }

                // Create the table row with product data
                // Template literals allow embedding variables directly in HTML strings
                const row = `
                    <tr>
                        <td>${product.id}</td>
                        <td>${product.name}</td>
                        <td>GHS ${product.price.toFixed(2)}</td>
                        <td>${product.quantity}</td>
                        <td>${badge}</td>
                    </tr>
                `;

                // Add the row to the table body
                tbody.innerHTML += row;
            });

            // Update total products count stat card
            document.getElementById("total-products").textContent = products.length;
        }

        // Fetches stats for total value and low stock count
        async function loadStats() {
            // Fetch low stock products
            const lowResponse = await fetch(`${API_URL}/products/low-stock`, {
                headers: {"Authorization": `Bearer ${token}`}
            });
            const lowStock = await lowResponse.json();

            // Update low stock count stat card
            document.getElementById("low-stock-count").textContent = lowStock.length;

            // Calculate total value from all products
            const allResponse = await fetch(`${API_URL}/products`, {
                headers: {"Authorization": `Bearer ${token}`}
            });
            const products = await allResponse.json();

            // Reduce sums price * quantity for each product
            const total = products.reduce((sum, p) => sum + (p.price * p.quantity), 0);

            // Format with GHS currency and 2 decimal places
            document.getElementById("total-value").textContent = `GHS ${total.toLocaleString('en-GH', {minimumFractionDigits: 2})}`;
        }

        // Called when Add Product button is clicked
        async function addProduct() {
            // Read values from the add product form
            const id = parseInt(document.getElementById("new-id").value);
            const name = document.getElementById("new-name").value;
            const price = parseFloat(document.getElementById("new-price").value);
            const quantity = parseInt(document.getElementById("new-quantity").value);

            try {
                // Send POST request to /products with the new product data as JSON
                const response = await fetch(`${API_URL}/products`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        // Include token — /products is a protected endpoint
                        "Authorization": `Bearer ${token}`
                    },
                    // Convert the product object to a JSON string
                    body: JSON.stringify({id, name, price, quantity})
                });

                const data = await response.json();

                if (!response.ok) {
                    // Something went wrong — show error message
                    showMessage("add-message", data.detail, "error");
                    return;
                }

                // Product added successfully — show success message
                showMessage("add-message", data.message, "success");

                // Clear the form inputs
                document.getElementById("new-id").value = "";
                document.getElementById("new-name").value = "";
                document.getElementById("new-price").value = "";
                document.getElementById("new-quantity").value = "";

                // Reload the table and stats to show the new product
                loadDashboard();

            } catch (error) {
                showMessage("add-message", "Could not connect to server", "error");
            }
        }

        // Helper function to show messages
        // elementId — the id of the message div
        // text — the message to display
        // type — "error" or "success" controls the colour
        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = `message ${type}`;

            // Hide the message automatically after 4 seconds
            setTimeout(() => {
                el.className = "message hidden";
            }, 4000);
        }
    </script>

</body>
</html>
